name: Release Multiplatform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            rust_targets: 'x86_64-unknown-linux-gnu'
            tauri_args: '--target x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            rust_targets: 'x86_64-pc-windows-msvc'
            tauri_args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build

      - name: Compile and Bundle Tauri Application with Updater Signatures
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wingnite Story ${{ github.ref_name }}'
          releaseBody: |
            ## Wingnite Story Enterprise — Релиз ${{ github.ref_name }}
            
            ### Основные изменения и радикальные улучшения:
            * **Смена порядка сцен и глав**: Добавлено каноническое поле `sort_order` в SQLite. Интерактивная смена мест глав в Оглавлении (`▲`/`▼`), Канбан-доске и при чтении.
            * **Радикальный апгрейд «Реестра» (Кодекс)**: Полноценная таксономия (Персонажи, Реликвии, Демиурги, Локации), переключение «Сетка / Таблица», создание сущностей с атрибутами и интерактивный инспектор связей.
            * **Радикальный апгрейд «Космоса» (Граф)**: Звездная визуализация с аурами сущностей, плазменными фотонными импульсами по связям, радар-миникартой и поиском с телепортацией камеры.
            * **Глубокая вкладка «Настройки»**: Управление шрифтами редактора, кареткой, интервалом автосохранения, порогами Lore Guardian и оптимизацией SQLite (WAL Checkpoint & VACUUM).
            * **Универсальный импорт и экспорт**: Поддержка чистого `.TXT` с умным авто-разбиением на главы, Markdown `.MD`, HTML-издания и сжатых пакетов `.WSTORY v2` (Gzip + Base64).
            * **Безупречная читаемость тем**: Полное соответствие стандарту WCAG AAA (>14:1) для светлых (Paper, Sepia) и темных (Obsidian, Celestial, OLED) тем.
            * **Ликвидация God Object**: Кодовая база разделена на специализированные модули и композаблы, обеспечивая молниеносный отклик и нулевое потребление лишних ресурсов.
            * **Полная очистка от демо-данных**: Никаких предустановленных тестовых текстов — чистое полотно для творчества автора с первого запуска.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

  release-android:
    runs-on: ubuntu-latest
    needs: release-desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Configure Android SDK and Dynamic NDK
        run: |
          ACTUAL_NDK="${ANDROID_NDK_HOME:-$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)}"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=$ACTUAL_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ACTUAL_NDK" >> $GITHUB_ENV
          mkdir -p /usr/local/lib/android/sdk/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Android APK and AAB
        run: |
          npx tauri android init
          npx tauri android build --apk
          npx tauri android build --aab

      - name: Sign or Prepare Android Assets
        env:
          KEYSTORE_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          RAW_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | head -n 1)

          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" Wingnite-Story-Android.aab
          fi

          if [ "$KEYSTORE_PRESENT" = "true" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools/ -name apksigner | sort -V | tail -n 1)
            $APKSIGNER sign --ks release.keystore --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --out Wingnite-Story-Android.apk "$RAW_APK"
          else
            cp "$RAW_APK" Wingnite-Story-Android.apk
          fi

      - name: Upload Android Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Wingnite-Story-Android.apk
            Wingnite-Story-Android.aab